---
name: EC2 httpd deployment

on:
  push:
    branches:
        - main

permissions:
    id-token: write
    contents: read

jobs:
  AWS_connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: aws OIDC connectivity 
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE }}
